<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e14;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* 仅一个文本元素 */
    .welcome-text {
      font-size: clamp(4rem, 18vw, 12rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f5e9ff, #c9b6ff, #9ad0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
      /* 非线性弹性入场 + 漂浮 */
      animation: elastic-drop 1.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) both,
                 float-slow 5s ease-in-out 1.4s infinite;
      transform-origin: center top;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.4));
      user-select: none;
    }

    /* 弹性下落 — 非线性 */
    @keyframes elastic-drop {
      0% {
        opacity: 0;
        transform: translateY(-200px) scale(0.5) rotate(-10deg);
        filter: blur(16px);
      }
      55% {
        opacity: 1;
        transform: translateY(20px) scale(1.08) rotate(3deg);
        filter: blur(0);
      }
      75% {
        transform: translateY(-10px) scale(0.97) rotate(-2deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
        filter: blur(0);
      }
    }

    /* 缓慢漂浮 — 非线性曲线 */
    @keyframes float-slow {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-15px) rotate(-1.5deg); }
      60% { transform: translateY(8px) rotate(1.2deg); }
      80% { transform: translateY(-5px) rotate(0.6deg); }
    }

    /* 极简背景光晕 — 不干扰文本 */
    body::before {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle at 30% 30%, rgba(160, 130, 255, 0.12), transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      animation: breathe 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- 只有一个文本元素：欢迎 -->
  <h1 class="welcome-text">欢迎</h1>

</body>
</html>
